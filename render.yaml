services:
  # 1. Backend API Service
  - type: web
    name: sreeraj-portfolio-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5005
      - key: MONGO_URI
        sync: false # Render will prompt you for your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret key
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: sreerajk8@gmail.com
      - key: ADMIN_PASSWORD
        sync: false # Render will prompt you to set your Admin dashboard password

  # 2. Frontend React Client
  - type: web
    name: sreeraj-portfolio-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      # Rewrite rule to route all requests back to index.html (vital for React Router)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point the React client to the newly deployed backend's URL
      - key: VITE_API_URL
        value: https://sreeraj-portfolio-backend.onrender.com/api
